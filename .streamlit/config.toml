[server]
# Always open the local dashboard in the default browser when it starts.
headless = false
runOnSave = true
address = "127.0.0.1"

[browser]
gatherUsageStats = false

[client]
# This is a local end-user app: hide Streamlit's developer toolbar and Deploy action.
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#173B66"
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#EEF2F7"
textColor = "#182230"
borderColor = "#D8E0EA"
blueColor = "#245B8F"
greenColor = "#168052"
redColor = "#C73E4B"
orangeColor = "#A96800"
yellowColor = "#A96800"
grayColor = "#667085"
violetColor = "#7057A3"
chartCategoricalColors = ["#173B66", "#168052", "#A96800", "#7057A3", "#245B8F", "#667085"]
baseRadius = "large"
buttonRadius = "medium"
showWidgetBorder = true
showSidebarBorder = true
dataframeHeaderBackgroundColor = "#EEF3F9"
linkUnderline = false
headingFontSizes = ["1.85rem", "1.4rem", "1.15rem"]
headingFontWeights = [700, 650, 650]

[theme.sidebar]
backgroundColor = "#F1F4F8"
secondaryBackgroundColor = "#FFFFFF"
primaryColor = "#173B66"
textColor = "#182230"
borderColor = "#D8E0EA"
