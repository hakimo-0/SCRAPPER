name: Build Windows installer

on:
  push:
    branches:
      - d-old-version
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assemble portable app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:GITHUB_WORKSPACE "build\stage"
          $pythonDir = Join-Path $stage "python"
          $sitePackages = Join-Path $pythonDir "Lib\site-packages"
          $browserDir = Join-Path $stage "ms-playwright"

          New-Item -ItemType Directory -Force -Path $sitePackages, $browserDir | Out-Null
          Copy-Item streamlit_app.py, app.py, agentur_app.py, requirements.txt, README.md, start_scrapper.bat -Destination $stage
          Copy-Item scraper -Destination $stage -Recurse
          Copy-Item .streamlit -Destination $stage -Recurse

          python -m pip install --upgrade pip
          python -m pip install --target $sitePackages -r requirements.txt

          $pythonVersion = python -c "import platform; print(platform.python_version())"
          $embedZip = Join-Path $env:RUNNER_TEMP "python-embed.zip"
          $embedUrl = "https://www.python.org/ftp/python/$pythonVersion/python-$pythonVersion-embed-amd64.zip"
          Invoke-WebRequest -Uri $embedUrl -OutFile $embedZip
          Expand-Archive -Path $embedZip -DestinationPath $pythonDir -Force

          $pth = Get-ChildItem $pythonDir -Filter "*._pth" | Select-Object -First 1
          $pthLines = Get-Content $pth.FullName
          if ($pthLines -notcontains "Lib\site-packages") {
            $pthLines += "Lib\site-packages"
          }
          $pthLines = $pthLines -replace "^#import site$", "import site"
          Set-Content -Path $pth.FullName -Value $pthLines -Encoding ASCII

          $env:PYTHONPATH = $sitePackages
          $env:PLAYWRIGHT_BROWSERS_PATH = $browserDir
          python -m playwright install chromium

          $portablePython = Join-Path $pythonDir "python.exe"
          & $portablePython -m streamlit --version
          & $portablePython -c "import pandas, playwright, streamlit; print('Portable runtime imports OK')"
          if ($LASTEXITCODE -ne 0) { throw "Portable Python validation failed." }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        shell: pwsh
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
        run: |
          $ErrorActionPreference = "Stop"
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $compiler "/DAppVersion=$env:APP_VERSION" "installer\SCRAPPER.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

      - name: Install and smoke-test setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:GITHUB_WORKSPACE "build\installer\SCRAPPER-Setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "scrapper-installed"
          $setup = Start-Process -FilePath $installer `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/DIR=$installDir") `
            -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup.exe installation failed with $($setup.ExitCode)." }

          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $installDir "ms-playwright"
          $app = Start-Process -FilePath (Join-Path $installDir "python\python.exe") `
            -ArgumentList @("-m", "streamlit", "run", "streamlit_app.py",
              "--server.address=127.0.0.1", "--server.port=18501", "--server.headless=true") `
            -WorkingDirectory $installDir -PassThru -WindowStyle Hidden
          $ready = $false
          try {
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if ($app.HasExited) { throw "Installed app exited before becoming healthy." }
              try {
                $response = Invoke-WebRequest -UseBasicParsing `
                  "http://127.0.0.1:18501/_stcore/health" -TimeoutSec 5
                if ($response.StatusCode -eq 200 -and $response.Content -eq "ok") {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 2
            }
            if (-not $ready) { throw "Installed app did not become healthy." }
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Publish latest installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "d-old-version-latest"
          $installer = "build\installer\SCRAPPER-Setup.exe"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            git tag --force $tag $env:GITHUB_SHA
            git push --force origin "refs/tags/$tag"
            gh release upload $tag $installer --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag $installer --repo $env:GITHUB_REPOSITORY `
              --title "SCRAPPER Windows installer (latest)" `
              --notes "Per-user Windows installer for the d-old-version branch." `
              --prerelease --target $env:GITHUB_SHA
          }
